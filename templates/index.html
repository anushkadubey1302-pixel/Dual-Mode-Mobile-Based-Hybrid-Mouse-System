<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Mouse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background: #f0f0f0;
            font-family: sans-serif;
        }

        #container {
            overflow-y: auto;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            flex-shrink: 0;
        }

        #sensitivity {
            width: 100%;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        #sensitivity label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #333;
        }

        #sensitivity input {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }

        #sensitivity input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
        }

        #touchpad {
            width: 100%;
            height: 30vh;
            background-color: #ddd;
            border: 2px solid #999;
            border-radius: 8px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            flex-shrink: 0;
        }

        #mouseSection {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 10px;
        }


        #clickBtn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }
        
        #button {
        margin: 6px;
        padding: 10px 14px;
        border-radius: 8px;
        min-width: 90px;
        min-height: 40px;
        touch-action: manipulation;
        font-size: 14px;
        }

        #controlButtons,
        #keyboardSection,
        #mediaSection,
        #presentationSection,
        #systemSection {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;

        }

        .controlBtn {
            padding: 8px 4px;
            font-size: 12px;
            cursor: pointer;
            background: #666;
            color: white;
            border: none;
            border-radius: 6px;
            text-align: center;
        }

        .controlBtn:active {
            background: #444;
        }
        button.active-tab {
            background: #4CAF50;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div id="container">
        <h2>📱 Hybrid Mouse Touchpad</h2>

    <div id="navButtons">
        <button id="btnMouse" onclick="showMouse()">🖱 Mouse</button>
        <button id="btnKeyboard" onclick="showKeyboard()">⌨ Keyboard</button>
        <button id="btnMedia" onclick="showMedia()">🎵 Media</button>
        <button id="btnPresentation" onclick="showPresentation()">📊 Presentation</button>
        <button id="btnSystem" onclick="showSystem()">💻 System</button>
    </div>
        
        <div id="sensitivity">
            <label for="sensitivitySlider">Sensitivity: <span id="sensitivityValue">1.0</span></label>
            <input type="range" id="sensitivitySlider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        
        <div id="mouseSection">

        <div id="touchpad"></div>
        <button id="clickBtn" onclick="clickMouse()">Left Click</button>
        
        <div id="controlButtons">
        <button class="controlBtn" onclick="rightClick()">Right Click</button>
        <button class="controlBtn" onclick="doubleClick()">Double Click</button>
        <button class="controlBtn" onclick="middleClick()">Middle Click</button>
        <button class="controlBtn" onclick="dragStart()">Drag Start</button>
        <button class="controlBtn" onclick="dragEnd()">Drag End</button>
        </div></div>


        <div id="keyboardSection" style="display:none;">
        <input type="text" id="textInput" placeholder="Type text here">
        <button onclick="sendText()">Send Text</button>
        <button onclick="sendEnter()">Enter</button>
        <button onclick="sendBackspace()">⌫ Backspace</button>
        <button onclick="copyText()">Copy</button>
        <button onclick="pasteText()">Paste</button>
        <button onclick="selectAll()">Ctrl+A</button>
        <button onclick="cutText()">Cut</button>
        <button onclick="undoAction()">Undo</button>
        <button onclick="redoAction()">Redo</button>
        <button onclick="sendTab()">Tab</button>
        </div>
        
        <div id="mediaSection" style="display:none;">
        <h3>🎵 Media Control</h3>

        <button onclick="volumeUp()">Vol +</button>
        <button onclick="volumeDown()">Vol -</button>

        <button onclick="muteAudio()">Mute</button>

        <button onclick="playPause()">Play / Pause</button>

        <button onclick="previousTrack()">Previous</button>
        <button onclick="nextTrack()">Next</button>
        </div>

        <div id="presentationSection" style="display:none;">
        <h3>📊 Presentation Control</h3>
        <button onclick="startPresentation()">Start (F5)</button>
        <button onclick="endPresentation()">End (Esc)</button>
        <button onclick="nextSlide()">Next Slide</button>
        <button onclick="previousSlide()">Previous Slide</button>
        <button onclick="blackScreen()">Black Screen (B)</button>
        </div>

        <div id="systemSection" style="display:none;">
        <h3>💻 System Control</h3>

        <button onclick="openNotepad()">Notepad</button>
        <button onclick="openCalculator()">Calculator</button>
        <button onclick="openChrome()">Chrome</button>

        <button onclick="lockScreen()">Lock Screen</button>
        <button onclick="takeScreenshot()">Screenshot</button>

        <button onclick="altTab()">Alt + Tab</button>
        </div>
    </div>

    <script>
        let touchpad = document.getElementById("touchpad");
        const THROTTLE_MS = 0; // No throttling for maximum speed
        let lastSendTime = 0;
        let lastScrollY = 0;
        let isDragging = false;
        let longPressTimer = null;
        let lastTapTime = 0;
        let sensitivity = 1.0;
        let pendingMove = null; // For batching rapid movements

        // Sensitivity slider
        const sensitivitySlider = document.getElementById("sensitivitySlider");
        const sensitivityValue = document.getElementById("sensitivityValue");

        sensitivitySlider.addEventListener("input", function() {
            sensitivity = parseFloat(this.value);
            sensitivityValue.textContent = sensitivity.toFixed(1);
        });

        // Optimized move sender
        function sendMove(data) {
            if (pendingMove) {
                // Cancel previous request and send new one immediately
                pendingMove = data;
                return;
            }
            
            pendingMove = data;
            
            // Send immediately
            fetch("/move", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            }).catch(err => console.log("Move error:", err))
            .finally(() => {
                pendingMove = null;
            });
        }

        // Get actual touchpad dimensions
        function getTouchpadSize() {
            return {
                width: touchpad.offsetWidth,
                height: touchpad.offsetHeight,
                left: touchpad.getBoundingClientRect().left,
                top: touchpad.getBoundingClientRect().top
            };
        }

        // Prevent all default touch behaviors
        document.addEventListener("touchmove", function(e) {
            if (e.target === touchpad || touchpad.contains(e.target)) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener("touchstart", function(e) {
            if (e.target === touchpad || touchpad.contains(e.target)) {
                e.preventDefault();
                
                if (e.touches.length === 1) {
                    // Start long press timer for right-click
                    longPressTimer = setTimeout(() => {
                        rightClick();
                        isDragging = true; // Enable dragging after long press
                    }, 500);
                }
            }
        }, { passive: false });

        touchpad.addEventListener("touchmove", function(e){
            e.preventDefault();
            
            // Remove throttling for instant response
            if (e.touches.length === 1) {
                // Clear long press timer on movement
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                
                // Single finger = mouse move with maximum precision
                let touch = e.touches[0];
                let size = getTouchpadSize();
                
        // Ultra-precise coordinate calculation
                let relativeX = Math.max(0, Math.min(touch.clientX - size.left, size.width));
                let relativeY = Math.max(0, Math.min(touch.clientY - size.top, size.height));

                // Send immediately without any delay - optimized for speed
                sendMove({
                    x: relativeX,
                    y: relativeY,
                    padWidth: size.width,
                    padHeight: size.height,
                    isDragging: isDragging,
                    sensitivity: sensitivity
                });
            } else if (e.touches.length === 2) {
                // Two fingers = scroll with instant response
                let touch1 = e.touches[0];
                let touch2 = e.touches[1];
                
                let currentY = (touch1.clientY + touch2.clientY) / 2;
                let deltaY = currentY - lastScrollY;
                
                if (Math.abs(deltaY) > 1) { // Very low threshold for instant scrolling
                    fetch("/scroll", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            deltaY: deltaY
                        })
                    });
                    lastScrollY = currentY;
                }
            }
        }, { passive: false });

        touchpad.addEventListener("touchend", function(e){
            e.preventDefault();
            
            // Clear long press timer
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            
            if (e.changedTouches.length === 1 && !isDragging) {
                // Single tap - check for double tap
                let now = Date.now();
                if (now - lastTapTime < 300) {
                    // Double tap detected
                    doubleClick();
                } else {
                    // Single tap
                    clickMouse();
                }
                lastTapTime = now;
            }
            
            // Reset dragging state
            isDragging = false;
            lastScrollY = 0;
        }, { passive: false });
        
        function showMouse() {
            hideAll();
        document.getElementById("mouseSection").style.display = "block";
            setActiveTab("btnMouse");
            
        }

        function clickMouse(){
            fetch("/click", {method:"POST"});
        }

        function rightClick(){
            fetch("/rightclick", {method:"POST"});
        }

        function doubleClick(){
            fetch("/doubleclick", {method:"POST"});
        }

        function middleClick(){
            fetch("/middleclick", {method:"POST"});
        }
        function dragStart(){
            fetch("/drag_start", {method:"POST"});
        }

        function dragEnd(){
            fetch("/drag_end", {method:"POST"});
        }


        function showKeyboard() {
            hideAll();
        document.getElementById("keyboardSection").style.display = "block";
            setActiveTab("btnKeyboard");
        }

        function sendText() {
            let text = document.getElementById("textInput").value;

            fetch("/type_text", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    text: text
               })
            });
        }  
        function sendEnter() {
            fetch("/enter", {
                method: "POST"
            });
        }    
        function sendBackspace() {
            fetch("/backspace", {
                method: "POST"
            });
        }
        function copyText() {
            fetch("/copy", {method:"POST"});
        }

        function pasteText() {
            fetch("/paste", {method:"POST"});
        }

        function selectAll() {
             fetch("/selectall", {method:"POST"});
        }

        function cutText() {
            fetch("/cut", {method:"POST"});
        }

        function undoAction() {
            fetch("/undo", {method:"POST"});
        }

        function redoAction() {
            fetch("/redo", {method:"POST"});
        }

        function sendTab() {
            fetch("/tab", {method:"POST"});
        }


        

        function showMedia() {
            hideAll();
        document.getElementById("mediaSection").style.display = "block";
            setActiveTab("btnMedia");
        }

        

        function volumeUp() {
            fetch("/volumeup", {
            method: "POST"
            });
        }

        function volumeDown() {
            fetch("/volumedown", {method:"POST"});
        }

        function muteAudio() {
            fetch("/mute", {method:"POST"});
        }

        function playPause() {
            fetch("/playpause", {method:"POST"});
        }

        function previousTrack() {
            fetch("/previoustrack", {method:"POST"});
        }

        function nextTrack() {
            fetch("/nexttrack", {method:"POST"});
        }

        function showPresentation() {
            hideAll();
        document.getElementById("presentationSection").style.display = "block";
            setActiveTab("btnPresentation");
        
        }

        function startPresentation() {
            fetch("/presentation/start", {method:"POST"});
        }

        function endPresentation() {
            fetch("/presentation/end", {method:"POST"});
        }

        function nextSlide() {
            fetch("/presentation/next", {method:"POST"});
        }

        function previousSlide() {
            fetch("/presentation/previous", {method:"POST"});
        }

        function blackScreen() {
            fetch("/presentation/black", {method:"POST"});
        }
         
        window.onload = function() {
            showMouse();
        };
        
        function setActiveTab(activeID) {
            let buttons = document.querySelectorAll("#navButtons button");
            buttons.forEach(btn => btn.classList.remove("active-tab"));
            document.getElementById(activeID).classList.add("active-tab");
                
        }

        
        function hideAll() {
            document.getElementById("mouseSection").style.display = "none";
            document.getElementById("keyboardSection").style.display = "none";
            document.getElementById("mediaSection").style.display = "none";
            document.getElementById("presentationSection").style.display = "none";
        }
        

        function showSystem() {
            hideAll();
        document.getElementById("systemSection").style.display = "block";
            setActiveTab("btnSystem");
        }

        function openNotepad() {
            fetch("/system/notepad", {method:"POST"});
        }

        function openCalculator() {
            fetch("/system/calculator", {method:"POST"});
        }   

        function openChrome() {
            fetch("/system/chrome", {method:"POST"});
        }

        function lockScreen() {
            fetch("/system/lock", {method:"POST"});
        }

        function takeScreenshot() {
            fetch("/system/screenshot", {method:"POST"});
        }

        function altTab() {
            fetch("/system/alttab", {method:"POST"});
        }   

        function hideAll() {
        document.getElementById("mouseSection").style.display = "none";
        document.getElementById("keyboardSection").style.display = "none";
        document.getElementById("mediaSection").style.display = "none";
        document.getElementById("presentationSection").style.display = "none";
        document.getElementById("systemSection").style.display = "none";
        }

    </script>

</body>
</html>
